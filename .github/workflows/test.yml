name: test

on:
  push:
  pull_request:

permissions:
  contents: read

# On main every run finishes, so each commit there has a result (a release
# waits for a green run). On other branches a newer push replaces the old run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.x"]  # 3.x = newest stable release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install as a package and run it
        shell: bash
        run: |
          python -m pip install -q .
          cd "$RUNNER_TEMP"
          taneko --help > /dev/null
          python -c "import taneko.core as c; assert not c.FROM_SOURCE and (c.CONFIG / 'asr.json').is_file(), c.CONFIG"
          TANEKO_PROJECTS="$RUNNER_TEMP/p" taneko init demo https://example.com/v --section 1:00-2:00
          test -f "$RUNNER_TEMP/p/demo/meta.json"
